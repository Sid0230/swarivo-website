<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
<title id="title">SWARIVO premium product mark</title>
<defs>
 <linearGradient id="ribbon" x1="55" y1="48" x2="188" y2="202" gradientUnits="userSpaceOnUse">
  <stop stop-color="#D8F57C"/><stop offset=".20" stop-color="#73D65B"/><stop offset=".48" stop-color="#14A965"/><stop offset=".72" stop-color="#087B50"/><stop offset="1" stop-color="#063E31"/>
 </linearGradient>
 <linearGradient id="leaf" x1="116" y1="30" x2="184" y2="101" gradientUnits="userSpaceOnUse">
  <stop stop-color="#E4FF9A"/><stop offset=".42" stop-color="#9AE65C"/><stop offset="1" stop-color="#39B946"/>
 </linearGradient>
 <linearGradient id="edge" x1="75" y1="75" x2="173" y2="180" gradientUnits="userSpaceOnUse">
  <stop stop-color="#F0FFB0" stop-opacity=".9"/><stop offset=".55" stop-color="#79E8A0" stop-opacity=".3"/><stop offset="1" stop-color="#073B2C" stop-opacity="0"/>
 </linearGradient>
 <filter id="depth" x="-35%" y="-35%" width="170%" height="170%">
   <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#001B13" flood-opacity=".42"/>
 </filter>
</defs>
<g filter="url(#depth)">
 <!-- single continuous premium S ribbon -->
 <path fill="url(#ribbon)" d="M154 42
   C132 42 107 48 91 60
   C78 70 72 82 76 94
   C80 106 92 113 112 121
   L153 138
   C171 146 179 155 177 166
   C175 179 160 190 140 196
   C125 201 108 201 93 197
   C111 210 133 214 153 208
   C179 201 197 185 200 165
   C203 143 189 126 163 115
   L122 98
   C110 93 105 87 108 81
   C112 72 128 66 151 63
   C166 61 177 63 187 66
   C180 51 169 43 154 42 Z"/>
 <!-- cut / inner negative curve gives the logo its crisp S read -->
 <path fill="#092E24" d="M92 116
   C106 124 124 131 145 139
   C157 144 163 150 162 156
   C160 164 150 170 136 174
   C119 179 102 178 89 173
   C101 188 121 194 141 190
   C161 186 176 174 179 160
   C182 145 172 134 153 126
   L112 109 C103 105 96 101 92 96
   C86 103 86 110 92 116 Z"/>
 <!-- upper leaf -->
 <path fill="url(#leaf)" d="M112 82
   C117 55 135 34 164 22
   C177 17 188 15 199 16
   C198 40 190 60 175 75
   C159 91 138 99 115 99
   C116 93 114 87 112 82 Z"/>
 <path d="M127 84 C145 63 161 48 181 35" fill="none" stroke="#F2FFD0" stroke-width="5" stroke-linecap="round" opacity=".9"/>
 <!-- controlled highlight on ribbon -->
 <path d="M94 69 C106 57 124 51 145 49" fill="none" stroke="url(#edge)" stroke-width="7" stroke-linecap="round"/>
 <path d="M82 91 C86 103 98 110 116 117" fill="none" stroke="#D9FF9B" stroke-width="4" stroke-linecap="round" opacity=".65"/>
</g>
<style>
g{transform-origin:120px 120px;animation:swarivoPremiumFloat 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes swarivoPremiumFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.008)}}
@media(prefers-reduced-motion:reduce){g{animation:none}}
</style>
</svg>