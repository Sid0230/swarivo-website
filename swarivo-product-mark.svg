<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">SWARIVO Product Mark</title>
<desc id="desc">An original animated S-shaped green mark with a rising leaf, created for the SWARIVO product experience.</desc>
<defs>
  <linearGradient id="s" x1="42" y1="35" x2="185" y2="210" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0b5539"/>
    <stop offset=".55" stop-color="#0e7a48"/>
    <stop offset="1" stop-color="#083c2b"/>
  </linearGradient>
  <linearGradient id="leaf" x1="118" y1="32" x2="190" y2="105" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#b8e878"/>
    <stop offset=".5" stop-color="#6fc34d"/>
    <stop offset="1" stop-color="#2f913d"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#063c29" flood-opacity=".18"/>
  </filter>
</defs>
<g filter="url(#shadow)">
  <path fill="url(#s)" d="M145 31c-35 3-70 21-83 48-11 23 1 43 31 56l50 22c15 7 20 14 16 23-4 10-18 18-38 22 35 1 65-16 74-41 9-27-7-48-39-62l-48-21c-15-7-20-14-16-23 5-10 20-19 53-24z"/>
  <path fill="url(#leaf)" d="M126 78c9-28 32-49 67-58 1 29-8 53-28 70-17 14-38 21-62 21 5-13 12-24 23-33z"/>
  <path fill="none" stroke="#e9f8d7" stroke-width="5" stroke-linecap="round" d="M141 77c15-18 30-31 47-42"/>
</g>
<g fill="none" stroke="#79c75b" stroke-linecap="round" opacity=".8">
  <path d="M43 173c16 21 37 34 62 40" stroke-width="3"/>
</g>
<style>
g[filter] { transform-origin: 120px 120px; animation: swarivoMarkFloat 5s ease-in-out infinite; }
path[fill="url(#leaf)"] { transform-origin: 158px 61px; animation: swarivoLeaf 4s ease-in-out infinite; }
@keyframes swarivoMarkFloat { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-1deg); } }
@keyframes swarivoLeaf { 0%,100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(3deg) scale(1.025); } }
@media (prefers-reduced-motion: reduce) {
  g[filter], path[fill="url(#leaf)"] { animation: none; }
}
</style>
</svg>